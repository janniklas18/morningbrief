name: Morgenbrief bauen & veröffentlichen

on:
  schedule:
    # GitHub-Cron läuft IMMER in UTC und ist "best effort": Läufe zur vollen
    # Stunde werden oft verzögert oder übersprungen. Deshalb eine krumme Minute
    # plus einen zweiten Versuch ~1 Std. später als Sicherheitsnetz.
    - cron: "17 4 * * *"    # ~06:17 Berlin (Sommer) / 05:17 (Winter)
    - cron: "17 5 * * *"    # Fallback, falls der erste Lauf übersprungen wird
  workflow_dispatch:        # erlaubt manuelles Auslösen über den Actions-Tab
  push:
    branches: [main]        # baut auch bei jedem Push (z. B. nach Feed-Änderung)

# Rechte, die actions/deploy-pages für GitHub Pages braucht:
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Abhängigkeiten installieren
        run: pip install -r requirements.txt

      - name: Seite bauen
        env:
          # Optional: für das KI-Tagesbriefing. Secret im Repo hinterlegen.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python build.py

      - name: Pages-Artefakt hochladen
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Auf GitHub Pages veröffentlichen
        id: deployment
        uses: actions/deploy-pages@v4
